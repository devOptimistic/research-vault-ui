<!-- Navbar -->
<nav class="max-w-7xl mx-auto w-full px-6 py-6 flex flex-col sm:flex-row justify-between items-center gap-4">
  <!-- Logo -->
  <div class="flex items-center gap-3">
    <div class="bg-indigo-600 text-white p-2 rounded-lg shadow-lg">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
    </div>
    <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Research Vault</h1>
  </div>

  <!-- Dynamic Auth Info / Links -->
  <div class="flex items-center gap-6 bg-white/60 backdrop-blur-md px-6 py-2.5 rounded-2xl shadow-sm border border-white/50">
    @if (authStore.isAuthenticated()) {
      <!-- Displayed when logged in -->
      <span class="text-sm font-medium text-slate-600 hidden sm:inline-block">
        Signed in as <span class="font-bold text-slate-900">{{ authStore.email() }}</span>
      </span>
      <button (click)="onLogout()" class="px-4 py-1.5 border border-slate-300 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-100 transition-colors">
        Log out
      </button>

      <!-- User Mini Profile -->
      <div class="flex items-center gap-3 border-l pl-6 border-slate-300">
        <img src="https://i.pravatar.cc/150?img=11" alt="User Avatar" class="w-10 h-10 rounded-full border-2 border-white shadow-sm">
      </div>
    } @else {
      <!-- Displayed when logged out -->
      <a routerLink="/login" class="text-sm font-bold text-indigo-600 hover:text-indigo-800 transition-colors">Log in</a>
      <a routerLink="/register" class="px-5 py-2 bg-[#3e445b] hover:bg-slate-800 text-white text-sm font-bold rounded-xl shadow-md transition-all active:scale-95">
        Sign up
      </a>
    }
  </div>
</nav>

<!-- Main Content Wrapper - Centered properly -->
<main class="grow max-w-6xl mx-auto w-full px-4 sm:px-6 mt-4 mb-12">
  <router-outlet />
</main>

<!-- Footer Text -->
<footer class="mt-auto py-6">
  <p class="text-xs text-slate-400 text-center font-medium px-4">
    Research Vault — self-hosted research & knowledge management.
  </p>
</footer>
