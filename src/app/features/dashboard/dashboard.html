<!-- Main Dashboard Dark Card -->
<div class="bg-[#3e445b] rounded-[2rem] shadow-2xl overflow-hidden border border-slate-700/50 p-8 sm:p-10 relative">

  <!-- Header Titles -->
  <div class="mb-8">
    <h2 class="text-3xl font-extrabold text-white tracking-tight">Your projects</h2>
    <p class="text-slate-300 mt-2 text-sm sm:text-base font-medium">Isolated containers for each research topic.</p>
  </div>

  <!-- Create Project Section -->
  <div class="bg-[#2d3248] rounded-2xl p-6 border border-slate-600/50 mb-10 shadow-inner">
    <div class="mb-5">
      <h3 class="text-xl font-bold text-white">Create a project</h3>
      <p class="text-sm text-slate-400 mt-1">Give it a name and an optional description.</p>
    </div>

    <form class="flex flex-col md:flex-row gap-4">
      <div class="flex-1 relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        </div>
        <input type="text" placeholder="Project name" class="w-full pl-11 pr-4 py-3.5 bg-slate-800/50 border border-slate-500 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition-all shadow-[0_0_15px_rgba(99,102,241,0.1)] focus:shadow-[0_0_20px_rgba(99,102,241,0.3)]">
      </div>

      <div class="flex-1 relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </div>
        <input type="text" placeholder="Description (optional)" class="w-full pl-11 pr-4 py-3.5 bg-slate-800/50 border border-slate-500 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:border-pink-400 focus:ring-1 focus:ring-pink-400 transition-all shadow-[0_0_15px_rgba(236,72,153,0.05)] focus:shadow-[0_0_20px_rgba(236,72,153,0.2)]">
      </div>

      <button type="submit" class="px-8 py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-[0_0_20px_rgba(79,70,229,0.5)] hover:shadow-[0_0_25px_rgba(79,70,229,0.7)] transition-all flex items-center justify-center gap-2 active:scale-95">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        Create
      </button>
    </form>
  </div>

  <!-- Projects Grid using modern @for syntax -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    
    @for (project of projects; track project.id) {
      <div class="bg-white rounded-2xl p-6 flex flex-col shadow-lg border border-slate-100 transform hover:-translate-y-1 transition-transform">
        <div class="flex-1">
          <h4 class="text-lg font-bold text-slate-900 leading-tight">{{ project.name }}</h4>
          <p class="text-sm text-slate-500 mt-2">{{ project.description }}</p>
        </div>
        <div class="mt-6">
          <div class="flex justify-between items-center mb-4">
            <span class="flex items-center text-xs font-medium text-slate-500">
              <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              {{ project.date }}
            </span>
          </div>
          <button class="w-full py-2.5 bg-[#403be4] hover:bg-blue-700 text-white rounded-xl text-sm font-semibold transition-colors shadow-md">
            Open project
          </button>
        </div>
      </div>
    } @empty {
      <div class="col-span-full text-center py-10 text-slate-400">
        You haven't created any projects yet.
      </div>
    }

  </div>
</div>
