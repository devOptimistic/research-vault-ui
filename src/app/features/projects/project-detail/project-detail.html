<!-- Main Content -->
<main class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 mt-2 mb-12">

    <!-- Main Dark Card -->
    <div class="bg-[#3e445b] rounded-[2rem] shadow-2xl overflow-hidden border border-slate-700/50 p-6 sm:p-10 relative">

        <!-- Header / Back Button -->
        <div class="mb-8">
            <a routerLink="/dashboard"
                class="inline-flex items-center text-sm font-semibold text-indigo-400 hover:text-indigo-300 transition-colors mb-3">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to projects
            </a>
            <h2 class="text-3xl font-extrabold text-white tracking-tight">{{ projectStore.currentProject()?.name ||
                'Project Details' }}</h2>
            <!-- <p class="text-slate-400 mt-1 text-sm font-medium">Project ID: {{ projectId() }}</p> -->
        </div>

        <!-- Global Search & Export -->
        <div class="mb-8 space-y-4">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1 relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="text" placeholder="Search notes & links..."
                        class="w-full pl-11 pr-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition-all shadow-inner">
                </div>
                <button
                    class="px-8 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-[0_0_15px_rgba(79,70,229,0.4)] hover:shadow-[0_0_20px_rgba(79,70,229,0.6)] transition-all active:scale-95">
                    Search
                </button>
            </div>

            <button
                class="inline-flex items-center gap-2 px-4 py-2 bg-[#2d3248] border border-slate-600 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                Export as Markdown
            </button>
        </div>

        <!-- Tabs Navigation -->
        <div class="border-b border-slate-600/50 mb-8 flex gap-2 overflow-x-auto hide-scrollbar">
            <button (click)="switchTab('notes')" id="btn-notes"
                [class]="activeTab() === 'notes' ? 'tab-btn pb-3 px-4 text-sm font-bold text-indigo-400 border-b-2 border-indigo-400 transition-colors whitespace-nowrap' : 'tab-btn pb-3 px-4 text-sm font-bold text-slate-400 hover:text-white border-b-2 border-transparent transition-colors whitespace-nowrap'">
                Notes
            </button>
            <button (click)="switchTab('links')" id="btn-links"
                [class]="activeTab() === 'links' ? 'tab-btn pb-3 px-4 text-sm font-bold text-indigo-400 border-b-2 border-indigo-400 transition-colors whitespace-nowrap' : 'tab-btn pb-3 px-4 text-sm font-bold text-slate-400 hover:text-white border-b-2 border-transparent transition-colors whitespace-nowrap'">
                Links
            </button>
            <button (click)="switchTab('websearch')" id="btn-websearch"
                [class]="activeTab() === 'websearch' ? 'tab-btn pb-3 px-4 text-sm font-bold text-indigo-400 border-b-2 border-indigo-400 transition-colors whitespace-nowrap' : 'tab-btn pb-3 px-4 text-sm font-bold text-slate-400 hover:text-white border-b-2 border-transparent transition-colors whitespace-nowrap'">
                Web Search
            </button>
            <button (click)="switchTab('tags')" id="btn-tags"
                [class]="activeTab() === 'tags' ? 'tab-btn pb-3 px-4 text-sm font-bold text-indigo-400 border-b-2 border-indigo-400 transition-colors whitespace-nowrap' : 'tab-btn pb-3 px-4 text-sm font-bold text-slate-400 hover:text-white border-b-2 border-transparent transition-colors whitespace-nowrap'">
                Tags
            </button>
        </div>

        <!-- ================= TABS CONTENT ================= -->

        <!-- TAB 1: Notes -->
        @if (activeTab() === 'notes') {
        <div id="tab-notes" class="tab-content active">
            <app-note-create [projectId]="projectId()" />
            <app-note-list [projectId]="projectId()" />
        </div>
        }

        <!-- TAB 2: Links -->
        @if (activeTab() === 'links') {
        <div id="tab-links" class="tab-content active">
            <app-link-list [projectId]="projectId()" />
        </div>
        }

        <!-- TAB 3: Web Search -->
        @if (activeTab() === 'websearch') {
        <div id="tab-web-search" class="tab-content active">
            <app-web-search [projectId]="projectId()" />
        </div>
        }

        <!-- TAB 4: Tags -->
        @if (activeTab() === 'tags') {
        <div id="tab-tags" class="tab-content active">
            <app-tag-list [projectId]="projectId()" />
        </div>
        }

    </div>
</main>
